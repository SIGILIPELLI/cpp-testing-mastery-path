site_name: C/C++ Testing Mastery Path
site_description: A structured, module-wise software testing program for C and C++ — manual QA fundamentals through automated unit testing, sanitizers and CI, entry level to master level.
site_url: https://sigilipelli.github.io/cpp-testing-mastery-path/
repo_url: https://github.com/SIGILIPELLI/cpp-testing-mastery-path
repo_name: cpp-testing-mastery-path

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Privacy Policy: privacy.md
  - "Level 1 · Entry":
      - Overview: level-1/index.md
      - "01 · What Is Software Testing?": level-1/01-what-is-software-testing.md
      - "02 · Test Case Design & Documentation": level-1/02-test-case-design-documentation.md
      - "03 · Test Types & Levels": level-1/03-test-types-and-levels.md
      - "04 · Defect Lifecycle & Bug Reporting": level-1/04-defect-lifecycle-bug-reporting.md
      - "05 · Manual Testing in Practice": level-1/05-manual-testing-in-practice.md
      - "06 · Toolchain Setup for Testers": level-1/06-toolchain-setup-for-testers.md
      - "07 · Unit Testing with GoogleTest": level-1/07-unit-testing-googletest.md
      - "08 · Unit Testing C with Unity/CMocka": level-1/08-unit-testing-c-unity-cmocka.md
      - "09 · Test Builds & Running Suites": level-1/09-test-builds-running-suites.md
      - "10 · Project — Test Plan & GoogleTest Suite": level-1/10-project-test-plan-and-suite.md
# --- auto-pruned stub levels (see AdSense low-value-content fix) ---
exclude_docs: |
  level-2/*.md
  level-3/*.md
  level-4/*.md
